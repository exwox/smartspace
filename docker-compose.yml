version: "3.9"

services:
  smart-space:
    build: .
    container_name: smart-space
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-smart-space-secret-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Notifikasi email tiket (diatur lewat file .env di root proyek)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      # data & upload persist meskipun container di-recreate
      - smart-space-data:/app/backend/data
      - smart-space-uploads:/app/backend/uploads

volumes:
  smart-space-data:
  smart-space-uploads: